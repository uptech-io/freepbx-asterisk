; FreePBX overrides. Loaded after php.ini; applies to Apache and fwconsole.

; post_max_size must be larger than upload_max_filesize.
upload_max_filesize = 64M
post_max_size = 72M
memory_limit = 512M

; FreePBX sets this in .htaccess inside <IfModule php7_module>, ignored by PHP 8.
max_input_vars = 5000

expose_php = Off
