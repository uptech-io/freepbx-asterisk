; Not autostarted: docker-bootstrap starts it when the boot steps are done.
; WINCH is Apache's graceful stop.
[program:apache2]
command=/usr/local/bin/apache2-foreground
priority=60
autostart=false
autorestart=true
stopsignal=WINCH
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
