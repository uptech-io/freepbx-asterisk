; One-shot: runs once per boot and exits (see docker-bootstrap).
; stopasgroup/killasgroup: a stop must also reach its child processes.
[program:bootstrap]
command=/usr/local/bin/docker-bootstrap
priority=50
autostart=true
autorestart=false
startsecs=0
startretries=0
exitcodes=0
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
