[program:asterisk]
command=/usr/local/asterisk/sbin/asterisk -f -n -U asterisk -G asterisk
priority=30
autostart=true
autorestart=unexpected
exitcodes=0
startsecs=5
startretries=5
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/var/log/supervisor/asterisk.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
redirect_stderr=true
